[versions]
morphe-patcher = "2.5.0"
#noinspection GradleDependency
smali = "5eaff5a2c9"
gson = "2.15.0"
animalsniffer = "2.0.1"
gummy-bears = "0.16.0"
androidx-fragment = "1.8.5"
shizuku = "13.1.5"
androidx-car-app = "1.4.0"

[libraries]
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "androidx-car-app" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
android-api-signature = { module = "com.toasttab.android:gummy-bears-api-26", version.ref = "gummy-bears" }
# Gradle plugins adds the dependency during build, this declaration is here only for dependabot to provide updates.
#noinspection UnusedVersionCatalogEntry
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }

[plugins]
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
